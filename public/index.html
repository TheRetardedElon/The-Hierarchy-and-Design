  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Hierarchy and Design</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    :root {
      --bg: #08090c;
      --ink: #eceae6;
      --muted: #8b8680;
      --line: #2a2c33;
      --card: rgba(14, 16, 22, 0.92);
      --gold: #e0b84d;
      --gold-ring: #f0c75a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
    }
    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: grab;
    }
    #map.dragging { cursor: grabbing; }
    .hud { position: fixed; z-index: 2; pointer-events: none; }
    .title-block { top: 28px; left: 32px; max-width: min(380px, calc(100vw - 400px)); }
    .title-block h1 { font-size: 22px; font-weight: 620; letter-spacing: 0.04em; line-height: 1.15; }
    .title-block p { margin-top: 6px; color: var(--muted); font-size: 13px; letter-spacing: 0.02em; }
    .legend {
      bottom: 24px; left: 32px; pointer-events: auto;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 12px 14px 10px; backdrop-filter: blur(10px); min-width: 220px;
    }
    .legend h2 {
      font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    }
    .legend-row {
      display: flex; align-items: center; gap: 8px; font-size: 12px;
      line-height: 1.45; color: #c9c5be; margin: 4px 0;
    }
    .swatch {
      width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
    }
    .legend-note {
      margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
      font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 8px;
    }
    .gold-dot {
      width: 11px; height: 11px; border-radius: 50%; background: #d4a574;
      box-shadow: 0 0 0 2.5px var(--gold-ring); flex: 0 0 11px;
    }
    .card {
      position: fixed; top: 28px; right: 28px; z-index: 3;
      width: min(320px, calc(100vw - 40px)); background: var(--card);
      border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 14px;
      backdrop-filter: blur(12px); display: none; box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    }
    .card.open { display: block; }
    .card-close {
      position: absolute; top: 10px; right: 12px; background: none; border: 0;
      color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1;
    }
    .card-close:hover { color: var(--ink); }
    .card-display { font-size: 16px; font-weight: 600; padding-right: 22px; line-height: 1.25; }
    .card-handle { color: var(--gold); font-size: 13px; margin: 4px 0 12px; }
    .meta { display: grid; grid-template-columns: 72px 1fr; gap: 6px 10px; font-size: 12.5px; }
    .meta dt { color: var(--muted); }
    .meta dd { color: var(--ink); word-break: break-word; }
    .flags { display: flex; flex-wrap: wrap; gap: 4px; }
    .flag {
      font-size: 10.5px; letter-spacing: 0.02em; padding: 2px 7px; border-radius: 99px;
      background: #1c1f28; border: 1px solid #32363f; color: #c4bfb6;
    }
    .empty { color: var(--muted); }
    .link { stroke: #4a4e5a; stroke-opacity: 0.55; stroke-width: 1.1; fill: none; }
    .node-label {
      font-size: 10px; fill: #b9b4ab; pointer-events: none; paint-order: stroke;
      stroke: #08090c; stroke-width: 3px; stroke-linejoin: round;
    }

    #side-board {
      top: 28px; right: 16px; left: auto; bottom: auto;
      pointer-events: auto; z-index: 2;
      width: min(312px, calc(100vw - 40px));
      max-height: calc(100vh - 56px);
      overflow-y: auto;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 12px 10px; backdrop-filter: blur(12px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    }
    #side-board::-webkit-scrollbar { width: 8px; }
    #side-board::-webkit-scrollbar-thumb { background: #2a2c33; border-radius: 8px; }
    #side-board h2 {
      font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
    }
    .board-sec {
      padding: 0 0 10px; margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .board-sec:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 2px; }
    .board-note { font-size: 11px; color: var(--muted); line-height: 1.4; margin-bottom: 8px; }
    .board-counts { font-size: 11.5px; color: #c9c5be; line-height: 1.45; margin-bottom: 8px; }
    .layer-stack { display: flex; flex-direction: column; gap: 3px; margin: 4px 0 2px; }
    .layer-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 11.5px; color: #c9c5be; line-height: 1.35;
    }
    .layer-row .swatch { width: 8px; height: 8px; flex: 0 0 8px; }
    .layer-num { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11px; }
    .layer-arrow { color: #3a3d46; font-size: 10px; padding-left: 16px; line-height: 1; }
    .rank-sub { font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.02em; }
    .rank-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; line-height: 1.4; color: #c9c5be;
      margin: 2px 0; padding: 4px 4px; border-radius: 6px; cursor: pointer;
    }
    .rank-row:hover { background: rgba(255,255,255,0.05); color: var(--ink); }
    .rank-num {
      color: var(--muted); font-variant-numeric: tabular-nums;
      flex: 0 0 16px; font-size: 11px;
    }
    .rank-handle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-followers { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; flex: 0 0 auto; }
    .rank-tags { display: flex; flex-wrap: wrap; gap: 3px; flex: 0 0 auto; }
    .tiny-tag {
      font-size: 9px; letter-spacing: 0.03em; padding: 1px 5px; border-radius: 99px;
      white-space: nowrap; border: 1px solid var(--line); color: var(--muted);
    }
    .tiny-tag.controller { color: var(--gold); border-color: var(--gold); background: rgba(224,184,77,0.12); }
    .tiny-tag.celebrity { color: var(--gold); border-color: var(--gold); background: rgba(224,184,77,0.12); }
    .tiny-tag.dummy { color: #b9b4ab; border-color: #3a3d46; }
    .tiny-tag.seed { color: #d4a574; border-color: #d4a574; background: rgba(212,165,116,0.12); }
    .tiny-tag.master { color: var(--gold); border-color: var(--gold); background: rgba(224,184,77,0.12); }
    .tiny-tag.puppet { color: #6b8fd4; border-color: #6b8fd4; background: rgba(107,143,212,0.12); }
    .tiny-tag.zombie { color: #b9b4ab; border-color: #3a3d46; }
    .celeb-badge {
      font-size: 9.5px; letter-spacing: 0.03em; padding: 1px 6px; border-radius: 99px;
      color: var(--gold); border: 1px solid var(--gold); background: rgba(224,184,77,0.12);
      white-space: nowrap;
    }
    .ctrl-block { margin: 2px 0 8px; }
    .ctrl-tree {
      font-size: 10.5px; color: var(--muted); padding: 0 4px 0 24px;
      line-height: 1.45;
    }
    .ctrl-tree .tree-link {
      color: #c9c5be; cursor: pointer; border-bottom: 1px dotted #3a3d46;
    }
    .ctrl-tree .tree-link:hover { color: var(--gold); }
    .hunt-line { font-size: 11.5px; color: #c9c5be; line-height: 1.4; margin: 3px 0; }
    .hunt-handles { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
    .hunt-chip {
      font-size: 11px; color: #c9c5be; background: #1c1f28; border: 1px solid #32363f;
      border-radius: 99px; padding: 2px 7px; cursor: pointer;
    }
    .hunt-chip:hover { color: var(--ink); border-color: var(--gold); }
    .watchlist { font-size: 10.5px; color: var(--muted); line-height: 1.45; margin-top: 2px; }
    .watchlist .tree-link { color: var(--muted); cursor: pointer; }
    .watchlist .tree-link:hover { color: var(--gold); }
    .uncounted { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .hint { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 2; color: #5c5852; font-size: 11px; pointer-events: none; }
  </style>
</head>

    document.getElementById("nodecount").textContent = GRAPH.nodes.length;

    const svg = d3.select("#map");
    const width = () => window.innerWidth;
    const height = () => window.innerHeight;

    svg.attr("width", width()).attr("height", height());

    const g = svg.append("g");
    const linkLayer = g.append("g").attr("class", "links");
    const nodeLayer = g.append("g").attr("class", "nodes");
    const labelLayer = g.append("g").attr("class", "labels");

    const clusters = GRAPH.clusters;
    const nodes = GRAPH.nodes.map((d) => Object.assign({}, d));
    const links = GRAPH.edges.map((d) => Object.assign({}, d));

    const color = (cluster) => (clusters[cluster] && clusters[cluster].color) || "#888";
    function isController(d) {
      const flags = d.flags || [];
      return d.cluster === "controller"
        || String(d.status || "").startsWith("controller")
        || flags.includes("controller-bridge")
        || flags.includes("controller-candidate");
    }
    function isMaster(d) {
      const flags = d.flags || [];
      return d.role === "master"
        || d.status === "controller-bridge"
        || flags.includes("controller-bridge");
    }
    const radius = (d) => {
      if (d.status === "confirmed") return 14;
      const base = Math.max(5.5, 9.5 - d.layer * 0.45);
      return isController(d) ? base + 2.2 : base;
    };

    const legend = d3.select("#legend");
    legend.append("h2").text("Clusters");
    Object.entries(clusters).forEach(([key, c]) => {
      const row = legend.append("div").attr("class", "legend-row");
      row.append("span").attr("class", "swatch").style("background", c.color);
      row.append("span").text(c.label);
    });
    const note = legend.append("div").attr("class", "legend-note");
    note.append("span").attr("class", "gold-dot");

    const zoom = d3.zoom()

      .on("end", () => svg.classed("dragging", false));

    svg.call(zoom);
    svg.on("click", (event) => {
      if (event.target === svg.node()) closeCard();
    });

    const clusterKeys = Object.keys(clusters);
    const clusterIndex = Object.fromEntries(clusterKeys.map((k, i) => [k, i]));
    function clusterHome(d) {
      const i = clusterIndex[d.cluster] ?? 0;
      const a = (i / Math.max(clusterKeys.length, 1)) * Math.PI * 2 - Math.PI / 2;
      const r = Math.min(width(), height()) * 0.42;
      return [width() / 2 + Math.cos(a) * r, height() / 2 + Math.sin(a) * r];
    }
    const simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id((d) => d.id).distance(140).strength(0.55))
      .force("charge", d3.forceManyBody().strength(-520))
      .force("center", d3.forceCenter(width() / 2, height() / 2))
      .force("collide", d3.forceCollide().radius((d) => radius(d) + 18).iterations(2))
      .force("radial", d3.forceRadial((d) => 40 + d.layer * 78, width() / 2, height() / 2).strength(0.22))
      .force("clusterX", d3.forceX((d) => clusterHome(d)[0]).strength(0.14))
      .force("clusterY", d3.forceY((d) => clusterHome(d)[1]).strength(0.14));

    const link = linkLayer.selectAll("line")

    node.append("circle")

      .attr("stroke-width", (d) => d.status === "confirmed" ? 1.6 : isController(d) ? 1.5 : 1);

    function fmtCount(n) {
      return (typeof n === "number" && isFinite(n)) ? n.toLocaleString("en-US") : "—";
    }

    function openCard(d) {
      document.getElementById("card-display").textContent = d.display || "-";
      document.getElementById("card-handle").textContent = d.handle || "";
      const clusterLabel = (clusters[d.cluster] && clusters[d.cluster].label) || d.cluster;
      const flags = (d.flags && d.flags.length)
        ? d.flags.map((f) => "<span class=\"flag\">" + esc(f) + "</span>").join("")
        : "<span class=\"empty\">none</span>";
      let extra = "";
      if (d.celebrity === true || d.celebrity === false) {
        extra += "<dt>celebrity</dt><dd>" + (d.celebrity === true ? "yes" : "no") + "</dd>";
      }
      if (d.followers != null) {
        const hud = (d.flags || []).includes("rounded-k") ? " HUD" : "";
        extra += "<dt>followers</dt><dd>" + fmtCount(d.followers) + hud + "</dd>";
      }
      document.getElementById("card-meta").innerHTML =
        "<dt>layer</dt><dd>" + esc(String(d.layer)) + "</dd>" +
        "<dt>cluster</dt><dd>" + esc(clusterLabel) + "</dd>" +
        "<dt>status</dt><dd>" + esc(d.status || "-") + "</dd>" +
        extra +
        "<dt>video</dt><dd>" + esc(d.video || "-") + "</dd>" +
        "<dt>flags</dt><dd class=\"flags\">" + flags + "</dd>";
      card.hidden = false;
      card.classList.add("open");
    }


    (function buildSideBoard() {
      const archEl = document.getElementById("board-arch");
      const folEl = document.getElementById("board-followers");
      const ctrlEl = document.getElementById("board-controllers");
      const huntEl = document.getElementById("board-hunt");
      if (!archEl || !folEl || !ctrlEl || !huntEl) return;

      const rawNodes = GRAPH.nodes;
      const rawEdges = GRAPH.edges;
      const byId = Object.create(null);
      rawNodes.forEach((n) => { byId[n.id] = n; });

      function edgeEnd(v) {
        return (v && typeof v === "object") ? v.id : v;
      }
      function liveNode(n) {
        return nodes.find((x) => x.id === n.id) || n;
      }
      function openById(id, ev) {
        if (ev) ev.stopPropagation();
        const n = byId[id];
        if (n) openCard(liveNode(n));
      }
      function clickableRow(el, n) {
        el.setAttribute("role", "button");
        el.addEventListener("click", (ev) => {
          ev.stopPropagation();
          openCard(liveNode(n));
        });
      }
      function isDummyNode(n) {
        const st = String(n.status || "");
        return st === "dummy" || st === "pending-drill" || st.startsWith("dummy");
      }
      function isSeedNode(n) {
        return n.cluster === "seed" || n.status === "confirmed";
      }
      function isWrapperFlag(n) {
        const flags = n.flags || [];
        return flags.includes("rocket-wrapper")
          || flags.includes("elon-wrapper")
          || flags.includes("rocket-elon-wrapper")
          || flags.includes("tesla-elon-wrapper")
          || n.cluster === "rocket-wrapper";
      }
      function celebFollowersSort(a, b) {
        const ac = a.celebrity === true ? 0 : 1;
        const bc = b.celebrity === true ? 0 : 1;
        if (ac !== bc) return ac - bc;
        const af = typeof a.followers === "number" ? a.followers : null;
        const bf = typeof b.followers === "number" ? b.followers : null;
        if (af == null && bf == null) return 0;
        if (af == null) return 1;
        if (bf == null) return -1;
        return bf - af;
      }
      function addTag(parent, cls, label) {
        const t = document.createElement("span");
        t.className = "tiny-tag " + cls;
        t.textContent = label;
        parent.appendChild(t);
      }
      function truncateNote(s, max) {
        const t = String(s || "").replace(/\s+/g, " ").trim();
        if (t.length <= max) return t;
        const cut = t.slice(0, max - 1);
        const nicer = cut.replace(/\s+\S*$/, "");
        return (nicer.length > 40 ? nicer : cut).trim() + "…";
      }

      const dummyOfSources = new Set();
      const parentTargets = Object.create(null);
      let vfEdgeCount = 0;
      const vfSources = new Set();
      rawEdges.forEach((e) => {
        const src = edgeEnd(e.source);
        const tgt = edgeEnd(e.target);
        if (!parentTargets[src]) parentTargets[src] = new Set();
        parentTargets[src].add(tgt);
        if (e.type === "dummy_of") dummyOfSources.add(src);
        if (e.type === "verified_follower_of") {
          vfEdgeCount += 1;
          vfSources.add(src);
        }
      });

      const dummyIds = new Set();
      rawNodes.forEach((n) => {
        if (isDummyNode(n) || dummyOfSources.has(n.id)) dummyIds.add(n.id);
      });
      dummyOfSources.forEach((id) => dummyIds.add(id));

      const seeds = rawNodes.filter(isSeedNode);
      const controllers = rawNodes.filter(isController);
      const bridges = rawNodes.filter((n) => (parentTargets[n.id] && parentTargets[n.id].size >= 2));
      const pendingDrill = rawNodes.filter((n) => n.status === "pending-drill");

      const uncounted = rawNodes.length - withFollowers.length;

      const dummyMasks = Object.create(null);
      rawEdges.forEach((e) => {
        if (e.type !== "verified_follower_of") return;
        const src = edgeEnd(e.source);
        const tgt = edgeEnd(e.target);
        if (!dummyIds.has(tgt)) return;

        dummyMasks[tgt].push(src);

        clickableRow(row, n);
        block.appendChild(row);
        const targets = parentTargets[n.id] ? Array.from(parentTargets[n.id]) : [];
        if (targets.length) {
          const tree = document.createElement("div");
          tree.className = "ctrl-tree";
          const short = (n.handle || n.id).replace(/^@/, "");
          tree.appendChild(document.createTextNode(short + " → "));
          targets.forEach((tid, ti) => {
            if (ti) tree.appendChild(document.createTextNode(" + "));
            const tnode = byId[tid];
            const a = document.createElement("span");
            a.className = "tree-link";
            a.textContent = tnode ? (tnode.handle || tnode.id) : tid;
            a.addEventListener("click", (ev) => openById(tid, ev));
            tree.appendChild(a);
          });
          block.appendChild(tree);
        }
        ctrlEl.appendChild(block);
      });

      // ---- HUNT ----
      huntEl.textContent = "";
      const hh = document.createElement("h2");
      hh.textContent = "Hunt";
      huntEl.appendChild(hh);

      const pdLine = document.createElement("p");
      pdLine.className = "hunt-line";
      pdLine.textContent = pendingDrill.length + " pending-drill";
      huntEl.appendChild(pdLine);
      const hoverPending = rawNodes.filter((n) => (n.flags || []).includes("rounded-k") && (n.flags || []).includes("controller-candidate"));
      if (hoverPending.length) {
        const hp = document.createElement("p");
        hp.className = "hunt-line";
        hp.textContent = hoverPending.length + " controller-candidate HUD (hover pending, not a Master)";
        huntEl.appendChild(hp);
        const hpChips = document.createElement("div");
        hpChips.className = "hunt-handles";
        hoverPending.forEach((n) => {
          const chip = document.createElement("span");
          chip.className = "hunt-chip";
          chip.textContent = n.handle || n.id;
          clickableRow(chip, n);
          hpChips.appendChild(chip);
        });
        huntEl.appendChild(hpChips);
      }
      const geoMismatch = rawNodes.filter((n) => (n.flags || []).includes("geo-mismatch"));
      if (geoMismatch.length) {
        const gp = document.createElement("p");
        gp.className = "hunt-line";
        gp.textContent = geoMismatch.length + " geo-mismatch (profile country vs About this account)";
        huntEl.appendChild(gp);
        const gChips = document.createElement("div");
        gChips.className = "hunt-handles";
        geoMismatch.forEach((n) => {
          const chip = document.createElement("span");
          chip.className = "hunt-chip";
          chip.textContent = n.handle || n.id;
          clickableRow(chip, n);
          gChips.appendChild(chip);
        });
        huntEl.appendChild(gChips);
      }

      const chips = document.createElement("div");
      chips.className = "hunt-handles";
      pendingDrill.slice(0, 8).forEach((n) => {
        const chip = document.createElement("span");
        chip.className = "hunt-chip";
        chip.textContent = n.handle || n.id;
        clickableRow(chip, n);
        chips.appendChild(chip);
      });
      huntEl.appendChild(chips);

      const maskKeys = Object.keys(dummyMasks);
      const highSignal = maskKeys.filter((did) => {
        const dummy = byId[did];
        if (dummy && isWrapperFlag(dummy)) return true;
        return dummyMasks[did].some((cid) => byId[cid] && isWrapperFlag(byId[cid]));
      }).sort((a, b) => dummyMasks[b].length - dummyMasks[a].length);

      const maskLine = document.createElement("p");
      maskLine.className = "hunt-line";
      maskLine.textContent = dummyMasks && maskKeys.length
        ? maskKeys.length + " dummy-to-mask hops"
        : "no dummy-to-mask hops yet";
      huntEl.appendChild(maskLine);
      highSignal.slice(0, 3).forEach((did) => {
        const dummy = byId[did];
        const kids = dummyMasks[did]
          .map((cid) => byId[cid])
          .filter((k) => k && (isWrapperFlag(k) || isWrapperFlag(dummy)))
          .slice(0, 3);
        const show = kids.length ? kids : dummyMasks[did].slice(0, 2).map((cid) => byId[cid]).filter(Boolean);
        const line = document.createElement("p");
        line.className = "ctrl-tree";
        const dspan = document.createElement("span");
        dspan.className = "tree-link";
        dspan.textContent = dummy ? (dummy.handle || dummy.id) : did;
        if (dummy) dspan.addEventListener("click", (ev) => openById(did, ev));
        line.appendChild(dspan);
        line.appendChild(document.createTextNode(" → "));
        show.forEach((k, ki) => {
          if (ki) line.appendChild(document.createTextNode(", "));
          const a = document.createElement("span");
          a.className = "tree-link";
          a.textContent = k.handle || k.id;
          a.addEventListener("click", (ev) => openById(k.id, ev));
          line.appendChild(a);
        });
        huntEl.appendChild(line);
      });

      const w = document.createElement("p");
      w.className = "watchlist";
      w.appendChild(document.createTextNode(kWatch.length + " K-handles uncounted · watchlist "));
      kWatch.forEach((n, i) => {
        if (i) w.appendChild(document.createTextNode(" · "));
        const a = document.createElement("span");
        a.className = "tree-link";
        a.textContent = n.handle || n.id;
        a.addEventListener("click", (ev) => openById(n.id, ev));
        w.appendChild(a);
      });
      huntEl.appendChild(w);
    })();

    function closeCard() {
      card.classList.remove("open");
      card.hidden = true;
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    simulation.on("tick", () => {
      link
        .attr("x1", (d) => d.source.x)
        .attr("y1", (d) => d.source.y)
        .attr("x2", (d) => d.target.x)
        .attr("y2", (d) => d.target.y);
      node.attr("transform", (d) => "translate(" + d.x + "," + d.y + ")");
      labels.attr("x", (d) => d.x).attr("y", (d) => d.y);
    });

    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.25).restart();
      d.fx = d.x;
      d.fy = d.y;
    }
    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }
    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }

    window.addEventListener("resize", () => {
      svg.attr("width", width()).attr("height", height());
      simulation.force("center", d3.forceCenter(width() / 2, height() / 2));
      simulation.force("radial", d3.forceRadial((d) => 40 + d.layer * 78, width() / 2, height() / 2).strength(0.22));
      simulation.force("clusterX", d3.forceX((d) => clusterHome(d)[0]).strength(0.14));
      simulation.force("clusterY", d3.forceY((d) => clusterHome(d)[1]).strength(0.14));
      simulation.alpha(0.3).restart();
    });

</script>
</body>
</html>
